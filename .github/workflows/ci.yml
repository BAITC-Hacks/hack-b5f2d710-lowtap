name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  OPENAI_API_KEY: ""
  OPENAI_MODEL: ""
  OPENAI_MODEL_FAST: ""

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline backend tests
        working-directory: backend
        run: python -m pytest -q -m "not slow"
      - name: Lint Python
        run: python -m ruff check backend scripts
      - name: Check Python formatting
        run: python -m ruff format --check backend scripts

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: ${{ hashFiles('web/package.json') != '' }}
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm ci
      - name: Test frontend
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm test
      - name: Build frontend
        if: ${{ hashFiles('web/package.json') != '' }}
        working-directory: web
        run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Prepare keyless CI configuration
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build complete application image
        run: docker compose build
      - name: Start application and wait for health
        run: docker compose up -d --wait --wait-timeout 90
      - name: Check API, rules, SSE, demo cache and frontend
        run: python scripts/container_smoke.py
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop containers and remove temporary volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
